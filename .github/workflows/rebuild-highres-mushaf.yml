name: Rebuild high-resolution Mushaf pages

on:
  push:
    branches: [fix/clean-verse-circle-artifacts]
    paths:
      - tools/build_highres_mushaf.py
      - .github/workflows/rebuild-highres-mushaf.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get pinned source artwork
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/Miftah-Fentaw/Quran-Images.git /tmp/quran-images-source
          git -C /tmp/quran-images-source sparse-checkout set webp
          git -C /tmp/quran-images-source checkout cca352724b9f29e326e077ce142172ddd9006368
      - name: Install image processing dependencies
        run: python -m pip install --disable-pip-version-check 'pillow>=10,<12' 'numpy>=1.26,<3' 'opencv-python-headless>=4.9,<5'
      - name: Rebuild all numbered pages and hit areas
        run: |
          mkdir -p /tmp/mushaf-rebuilt
          python tools/build_highres_mushaf.py /tmp/quran-images-source/webp app/src/main/assets/mushaf /tmp/mushaf-rebuilt
          test "$(find /tmp/mushaf-rebuilt -maxdepth 1 -name '*.png' | wc -l)" -eq 604
          cp /tmp/mushaf-rebuilt/*.png /tmp/mushaf-rebuilt/highres_ayah_bounds.json app/src/main/assets/mushaf/
      - name: Commit generated assets on the task branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/mushaf
          git commit -m 'Clean verse-circle artifacts on all Mushaf pages'
          git push origin HEAD:${GITHUB_REF_NAME}
